name: Verify build

# Proves the repo is in a buildable, runnable state — the check the
# sync-upstream-core PR (main <- upstream-main) relies on before a human
# merges it, and the check every other PR against main gets too.
#
# Two independent signals:
#   - build: cargo build/check against the committed Cargo.lock (--locked),
#     so a stale lockfile fails loudly instead of silently drifting. clippy
#     runs too but is non-blocking (continue-on-error): most of this tree
#     arrives via the upstream sync PR, not lines NANDA wrote, so a lint
#     style change upstream shouldn't turn a merge-worthy sync red — it's
#     reported for visibility, not gated.
#   - compose-config: `docker compose config` against .env.example, a
#     cheap syntax/interpolation check that catches a broken compose file
#     or a variable renamed in one place and not the other, without
#     needing real infra or secrets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # lance-encoding (lance, used by the server) runs prost-build, which needs protoc.
      # server/Dockerfile installs the same package for the deployed image.
      - name: Install protoc
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler

      - name: cargo build --workspace --locked
        run: cargo build --workspace --locked

      - name: cargo check --workspace --locked
        run: cargo check --workspace --locked

      - name: cargo clippy --workspace --all-targets --locked (non-blocking)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: If this failed on a stale lockfile
        if: failure()
        run: |
          echo "::error::If the failure above is 'the lock file needs to be updated', Cargo.lock is stale."
          echo "Regenerate it after any Cargo.toml change: cargo build --workspace"
          echo "then commit the updated Cargo.lock."

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml against .env.example
        run: |
          cp .env.example .env
          docker compose config -q
