name: Notify private repo

# pull_request_target, not pull_request: the latter does not have access to
# secrets when the PR comes from a fork (which is the common case for external
# contributors). pull_request_target runs in the context of the BASE repo, so
# PRIVATE_REPO_PAT is available.
#
# This is safe because the workflow does NOT check out or execute any code from
# the fork — it only reads PR metadata and sends a dispatch.
on:
  pull_request_target:
    types: [opened, synchronize]
    branches: [main]

jobs:
  dispatch-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      # Only the PR number and its head SHA cross: the private import fetches the
      # title, author and base from the API itself and verifies the SHA. The JSON
      # is built by jq from environment variables, never by pasting PR fields into
      # the shell: a PR title is attacker-controlled, and this job holds a secret.
      # The production public repository notifies the production private one with its own secret. Any other
      # repository (a sync rehearsal) needs OSS_REHEARSAL_PRIVATE_SLUG naming a *sync-rehearsal* repository and its
      # own OSS_REHEARSAL_DISPATCH_TOKEN; it can never dispatch to production.
      - name: Trigger PR import in private repo
        env:
          PAT: ${{ github.repository == 'Nasiko-Labs/nasiko' && secrets.PRIVATE_REPO_PAT || secrets.OSS_REHEARSAL_DISPATCH_TOKEN }}
          PRIVATE_SLUG: ${{ github.repository == 'Nasiko-Labs/nasiko' && 'Nasiko-Labs/nasiko-cloud-rs' || vars.OSS_REHEARSAL_PRIVATE_SLUG }}
          PRODUCTION: ${{ github.repository == 'Nasiko-Labs/nasiko' }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$PRODUCTION" != "true" ]; then
            lower=$(printf '%s' "$PRIVATE_SLUG" | tr '[:upper:]' '[:lower:]')
            case "$lower" in
              nasiko-labs/nasiko-cloud-rs|nasiko-labs/nasiko|"") echo "::error::not a rehearsal target: '$PRIVATE_SLUG'"; exit 1 ;;
              *sync-rehearsal*) ;;
              *) echo "::error::a rehearsal may only dispatch to a *sync-rehearsal* repository"; exit 1 ;;
            esac
          fi
          if [ "$ACTION" = "opened" ]; then TYPE=oss-pr-opened; else TYPE=oss-pr-synchronized; fi
          jq -n --arg type "$TYPE" --argjson pr "$PR_NUMBER" --arg sha "$HEAD_SHA" \
            '{event_type: $type, client_payload: {pr_number: $pr, head_sha: $sha}}' \
            | curl -fsSL -X POST \
                -H "Authorization: token ${PAT}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${PRIVATE_SLUG}/dispatches" \
                --data-binary @-
