name: External A2A native acceptance
on:
  workflow_dispatch:
  pull_request:
    # Keep this native build + real peer job off unrelated application changes.
    # Dispatch it manually when reviewing wider infrastructure changes.
    paths:
      - '.github/workflows/nanda-external-native.yml'
      - 'server/src/nanda_external/**'
      - 'server/src/agents/**'
      - 'server/src/catalog/**'
      - 'server/src/admin/routes.rs'
      - 'server/src/agent_lifecycle.rs'
      - 'server/src/serve.rs'
      - 'server/src/auth/**'
      - 'server/src/users/routes.rs'
      - 'server/src/main.rs'
      - 'server/src/lib.rs'
      - 'server/src/state.rs'
      - 'server/tests/nanda_external_registration.rs'
      - 'server/tests/agent_update_rollback.rs'
      - 'server/tests/common/**'
      - 'server/build.rs'
      - 'server/Cargo.toml'
      - 'spa/**'
      - 'auth/**'
      - 'mcp-gateway/src/agent_tokens.rs'
      - 'session-token/src/lib.rs'
      - 'config/**'
      - 'secrets/**'
      - 'migrations/**'
      - 'Cargo.*'
      - 'scripts/oasis-external-openclaw/**'
      - 'ui/e2e/native-external-smoke.mjs'
      - 'ui/shared/features/src/agents/**'
      - 'ui/shared/app-core/src/session.ts'
      - 'ui/shared/app-shell/src/routes/login.tsx'
      - 'ui/shared/data-access/src/auth.ts'
      - 'ui/oss/app/**'
      - 'ui/scripts/app.ts'
      - 'ui/vite.shared.ts'
      - 'ui/package.json'
      - 'ui/pnpm-*'
      - 'ui/.nvmrc'
permissions:
  contents: read
concurrency:
  group: external-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  member-to-openclaw:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      VITE_NASIKO_API_MODE: live
      CP_BIND: 127.0.0.1:18817
      DATABASE_URL: postgres://nasiko:nasiko@127.0.0.1:15417/nasiko_dev
      TEST_PG_URL: postgres://nasiko:nasiko@127.0.0.1:15417/nasiko_dev
      REDIS_URL: redis://127.0.0.1:16317
      TEST_REDIS_URL: redis://127.0.0.1:16317
      S3_ENDPOINT: http://127.0.0.1:19017
      TEST_S3_ENDPOINT: http://127.0.0.1:19017
      S3_ACCESS_KEY: nasiko
      S3_SECRET_KEY: nasiko123
      S3_REGION: us-east-1
      S3_BUCKET: oasis-ci
      AWS_EC2_METADATA_DISABLED: 'true'
      AGENT_RUNTIME: simulated
      SANDBOX_PROVIDER: pod
      SIM_AGENT_URL: http://127.0.0.1:1
      OTEL_SDK_DISABLED: 'true'
      MODEL_CATALOG_SYNC_ENABLED: 'false'
      MODEL_PRICING_SYNC_ENABLED: 'false'
      NANDA_EXTERNAL_A2A_TARGETS: '[{"card_url":"http://127.0.0.1:18916/.well-known/agent-card.json","endpoint":"http://127.0.0.1:18916/a2a/v1"}]'
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nasiko
          POSTGRES_PASSWORD: nasiko
          POSTGRES_DB: nasiko_dev
        ports: ['127.0.0.1:15417:5432']
        options: --health-cmd "pg_isready -U nasiko -d nasiko_dev" --health-interval 4s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['127.0.0.1:16317:6379']
      storage:
        image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        env:
          RUSTFS_ACCESS_KEY: nasiko
          RUSTFS_SECRET_KEY: nasiko123
        ports: ['127.0.0.1:19017:9000']
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: ui/.nvmrc }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: external-native }
      - name: Build the actual OSS browser bundle
        working-directory: ui
        run: |
          npm install --global --prefix "$RUNNER_TEMP/nanda-tools" pnpm@12.8.1
          "$RUNNER_TEMP/nanda-tools/bin/pnpm" install --frozen-lockfile
          "$RUNNER_TEMP/nanda-tools/bin/pnpm" exec playwright install --with-deps chromium
          node scripts/app.ts build oss
      - name: Build native Oasis and test protocol and database behavior
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
          cargo build --locked -p nasiko-server --bin nasiko-server
          cargo test --locked -p nasiko-server --lib nanda_external::
          cargo test --locked -p nasiko-server --test nanda_external_registration -- --test-threads=1
          cargo test --locked -p nasiko-server --test agent_update_rollback update_by_different_superuser_queues_job_with_real_owner -- --exact
      - name: Run a real member's browser against Oasis and offline OpenClaw
        env:
          ADMIN_USERNAME: oasis-ci
          OASIS_TEST_ADMIN: oasis-ci
          OASIS_TEST_PORT: '18817'
        run: |
          docker compose -p oasis16-openclaw -f scripts/oasis-external-openclaw/compose.yaml up -d --wait --wait-timeout 200
          export ADMIN_PASSWORD="$(openssl rand -hex 32)"
          export OASIS_TEST_ADMIN_PASSWORD="$ADMIN_PASSWORD"
          export JWT_SECRET="$(openssl rand -hex 32)"
          export SECRETS_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          target/debug/nasiko-server >"$RUNNER_TEMP/oasis-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --retry 40 --retry-delay 2 --retry-connrefused --fail --silent --show-error http://127.0.0.1:18817/health >/dev/null
          node ui/e2e/native-external-smoke.mjs
