# Disposable loopback A2A relay. No UI, configuration API, websocket or generic proxy.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    upstream claw {
        zone claw 32k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        server agent:18916 resolve;
    }
    server {
        listen 18916;
        client_max_body_size 1m;
        proxy_read_timeout 135s;
        proxy_pass_request_headers off;
        location = /.well-known/agent-card.json {
            limit_except GET { deny all; }
            proxy_pass http://claw;
        }
        location = /a2a/v1 {
            limit_except POST { deny all; }
            proxy_set_header Content-Type application/json;
            proxy_set_header A2A-Version $http_a2a_version;
            proxy_set_header Authorization $http_authorization;
            proxy_next_upstream off;
            proxy_pass http://claw;
        }
        location / { return 404; }
    }
}
