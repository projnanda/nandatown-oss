# One workspace for the whole UI, one lockfile: the ui/ root (the tooling), the shared packages (shared/*), each
# edition's app and feature packages, design/ and the desktop packagers. Found by shape, like scripts/editions.ts, so
# the file names no edition and the published copy finds only what the public tree has.
packages:
  - '*'
  - '*/*'
  - '*/*/*'

# npm's layout: one flat node_modules at ui/. An edition's app dir (oss/ and the ones beside it) is not a package and
# resolves every dependency from there.
nodeLinker: hoisted

# Carried over from the npm lockfile: d3-scale (the charts' scales) on d3-format 3.1.2, while @visx/vendor keeps the
# 3.1.0 it pins exactly. Without it pnpm settles both on 3.1.0, a downgrade for the charts.
overrides:
  d3-scale>d3-format: 3.1.2

# A dependency's install script runs only if it is decided here (pnpm 12 refuses an install with an undecided one).
#   electron-winstaller  picks the 7-Zip binary the Windows desktop installer uses; npm ran it too
#   esbuild              only re-checks its native binary, which its platform package already provides
#   msw                  copies its worker into ui/public, which nothing serves (the app's copy is common/public)
allowBuilds:
  electron-winstaller: true
  esbuild: false
  msw: false
